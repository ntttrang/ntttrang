<style>@keyframes fadeInAnimation{from{opacity:0}to{opacity:1}}.h{font:600 18px 'Segoe UI', Ubuntu, Sans-Serif;fill:#2f80ed;animation:fadeInAnimation .8s ease-in-out forwards}@supports(-moz-appearance:auto){.h{font-size:15.5px}}.n{font:800 36px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#434d58}.cap{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#858585}.lbl{font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#434d58}.cnt{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#434d58}.stagger{opacity:0;animation:fadeInAnimation .3s ease-in-out forwards}</style>
