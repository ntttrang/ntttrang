name: Update README stats cards

# Generates static SVG stat cards and commits them to the repo, so the
# profile README never depends on the (rate-limited) public instance at view time.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'   # re-run only when this file changes
      - 'README.md'
      - 'scripts/AI-enabled-stats.py'
      - 'scripts/streak-stats.py'
      - 'scripts/compose-overview.py'
  schedule:
    - cron: "17 3 * * *"                         # daily ~03:17 UTC (off the :00 herd)
  workflow_dispatch:                             # manual "Run workflow" button

permissions:
  contents: write                                # required to commit SVGs back

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e  # v2
        with:
          card: stats
          options: "username=ntttrang&show_icons=true&theme=default"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-languages card
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e  # v2
        with:
          card: top-langs
          options: "username=ntttrang&layout=compact&langs_count=10&show_icons=true&theme=default&card_width=460"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI-enabled card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/AI-enabled-stats.py

      - name: Generate streaks card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/streak-stats.py

      - name: Compose overview (combine all cards into one image)
        run: python3 scripts/compose-overview.py

      - name: Bust README image cache
        # Put the content version in the FILENAME, not a ?query. GitHub's /raw/
        # redirect strips query strings, so ?v= never reaches the image request
        # and the browser keeps serving a cached copy. A new filename is a
        # genuinely new URL to every cache (browser, CDN, camo), so the README
        # can never display a stale card. Hash is derived from overview.svg, so
        # it only changes when the card actually changes (no churn otherwise).
        run: |
          python3 - <<'PY'
          import hashlib, re, pathlib, glob
          ov = pathlib.Path("profile/overview.svg").read_bytes()
          h = hashlib.sha1(ov).hexdigest()[:10]
          name = f"overview-{h}.svg"
          for f in glob.glob("profile/overview-*.svg"):        # drop prior version
              pathlib.Path(f).unlink()
          (pathlib.Path("profile") / name).write_bytes(ov)      # versioned copy
          p = pathlib.Path("README.md"); s = p.read_text()
          s2, n = re.subn(r'src="\./profile/overview[^"]*"',
                          f'src="./profile/{name}"', s)
          p.write_text(s2)
          print(f"wrote profile/{name}; README src updated (replacements={n})")
          PY

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile/ README.md
          # Nothing staged -> nothing to do (e.g. a run where no card changed).
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: update GitHub stats cards [skip ci]"
          # [skip ci] so this bot commit does not re-trigger the workflow
          # (README.md is a push-trigger path -> would otherwise loop).
          # Rebase onto latest main: a concurrent run may have pushed since
          # checkout, which would otherwise reject this push (non-fast-forward).
          git pull --rebase origin main
          git push
