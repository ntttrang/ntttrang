name: Update README stats cards

# Generates static SVG stat cards and commits them to the repo, so the
# profile README never depends on the (rate-limited) public instance at view time.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'   # re-run only when this file changes
      - 'README.md'
      - 'scripts/AI-enabled-stats.py'
      - 'scripts/streak-stats.py'
      - 'scripts/compose-overview.py'
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:                             # manual "Run workflow" button

permissions:
  contents: write                                # required to commit SVGs back

concurrency:
  group: update-stats
  # Queue, don't cancel. This job commits to main, so two overlapping runs race
  # on the content-hashed overview file (rename/rename conflict on rebase).
  # With cancel-in-progress a killed run can leave a commit on the branch that
  # the next run then collides with; serializing lets each run see the previous
  # run's push before it checks out.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e  # v2
        with:
          card: stats
          options: "username=ntttrang&show_icons=true&theme=default"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-languages card
        uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e  # v2
        with:
          card: top-langs
          options: "username=ntttrang&layout=compact&langs_count=10&show_icons=true&theme=default&card_width=460"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI-enabled card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/AI-enabled-stats.py

      - name: Generate streaks card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/streak-stats.py
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=default&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose overview (combine all cards into one image)
        run: python3 scripts/compose-overview.py

      - name: Commit & push cards (resilient to concurrent pushes)
        # Snapshot the freshly generated cards, then commit + push in a retry
        # loop. If a concurrent run (or a manual push) advanced main since our
        # checkout, `git pull --rebase` would hit a rename/rename conflict on
        # the content-hashed overview file that git can't auto-resolve. On any
        # failure we abort the rebase, hard-reset to the latest origin/main,
        # and replay our generated cards as a FRESH commit on top -- with no
        # historical rename to replay, nothing can conflict. The cards are
        # regenerated from live data, so a fresh commit is always the correct
        # result. [skip ci] keeps the bot commit from re-triggering this push.
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot generated cards so we can replay them verbatim after a reset.
          rm -rf /tmp/gen && mkdir -p /tmp/gen
          cp -r profile /tmp/gen/profile
          cp README.md /tmp/gen/README.md

          for attempt in 1 2 3 4 5; do
            # Replay generated cards over the working tree, then version the
            # overview image (new filename = new URL = real cache bust, since
            # GitHub's /raw/ redirect strips ?query= strings).
            rm -rf profile && cp -r /tmp/gen/profile profile
            cp /tmp/gen/README.md README.md
            python3 scripts/version-overview.py

            git add -A profile/ README.md
            if git diff --cached --quiet; then echo "nothing to commit"; break; fi
            git commit -m "chore: update GitHub stats cards [skip ci]" >/dev/null || break

            if git pull --rebase origin main && git push; then
              echo "pushed on attempt $attempt"
              break
            fi

            echo "attempt $attempt: rebase/push failed (concurrent push?); resetting to origin/main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
          done
