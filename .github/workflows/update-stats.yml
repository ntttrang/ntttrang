name: Update README stats cards

# Generates static SVG stat cards and commits them to the repo, so the
# profile README never depends on the (rate-limited) public instance at view time.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'   # re-run only when this file changes
      - 'README.md'
      - 'scripts/ai-powered-stats.py'
      - 'scripts/streak-stats.py'
      - 'scripts/compose-overview.py'
  schedule:
    - cron: "17 3 * * *"                         # daily ~03:17 UTC (off the :00 herd)
  workflow_dispatch:                             # manual "Run workflow" button

permissions:
  contents: write                                # required to commit SVGs back

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=ntttrang&show_icons=true&theme=default"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top-languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=ntttrang&layout=compact&langs_count=10&show_icons=true&theme=default"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AI-powered card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/ai-powered-stats.py

      - name: Generate streaks card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/streak-stats.py

      - name: Compose overview (combine all cards into one image)
        run: python3 scripts/compose-overview.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub stats cards" || exit 0
          git push
